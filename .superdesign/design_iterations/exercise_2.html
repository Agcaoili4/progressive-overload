<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Exercise — Barbell Bench Press</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; background: #050505; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .font-mono-num { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .hero-num {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 0.9;
  }
  .safe-b { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  .safe-t { padding-top: max(0px, env(safe-area-inset-top)); }
</style>
</head>
<body class="bg-[#050505] text-white">

  <div class="mx-auto flex h-dvh w-full max-w-md flex-col bg-[#050505] md:max-w-lg md:border-x md:border-white/10 lg:max-w-xl">

    <!-- ============ HEADER ============ -->
    <header class="safe-t flex-none border-b border-white/10 px-4 pt-4 pb-3">
      <div class="flex items-center gap-2">
        <button
          type="button"
          aria-label="Back to session"
          class="flex h-11 w-11 flex-none -ml-2 items-center justify-center rounded-xl text-white/70 transition active:scale-90 active:bg-white/10"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div class="min-w-0 flex-1">
          <h1 class="truncate text-[17px] font-bold tracking-tight text-white">Barbell Bench Press</h1>
          <p class="text-[11px] font-medium uppercase tracking-wider text-white/40">Chest &middot; Push Day &middot; Exercise 3 of 5</p>
        </div>
      </div>
    </header>

    <!-- ============ SCROLLABLE MIDDLE ============ -->
    <main class="flex-1 overflow-y-auto px-4 pb-4">

      <!-- Rest timer (active state) -->
      <section class="mt-4 flex items-center gap-4 rounded-2xl border border-lime-300/20 bg-lime-300/[0.06] px-4 py-3">
        <div class="relative flex h-16 w-16 flex-none items-center justify-center">
          <svg viewBox="0 0 100 100" class="h-16 w-16 -rotate-90">
            <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="9" />
            <circle
              cx="50" cy="50" r="42" fill="none"
              stroke="#d3f95a" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="263.9" stroke-dashoffset="17.6"
            />
          </svg>
          <span class="absolute text-[9px] font-bold uppercase tracking-wider text-lime-300/80">rest</span>
        </div>
        <div class="min-w-0 flex-1">
          <p class="font-mono-num text-3xl font-bold tabular-nums text-lime-300">1:24</p>
          <p class="text-[11px] font-medium uppercase tracking-wider text-white/40">of 1:30 &middot; resting between sets</p>
        </div>
        <button
          type="button"
          class="h-11 flex-none rounded-xl border border-white/15 px-4 text-xs font-bold uppercase tracking-wider text-white/70 transition active:scale-95 active:bg-white/10"
        >
          Skip
        </button>
      </section>

      <!-- Last time reference -->
      <p class="mt-4 text-[13px] leading-snug text-white/35">
        <span class="font-medium text-white/45">Last time:</span> 80kg &times; 8, 80kg &times; 7, 80kg &times; 6
      </p>

      <!-- Completed sets ledger -->
      <section class="mt-3 overflow-hidden rounded-2xl border border-white/10">
        <div class="flex items-center justify-between border-b border-white/10 bg-white/[0.03] px-4 py-2">
          <span class="text-[11px] font-bold uppercase tracking-wider text-white/40">This session</span>
          <span class="text-[11px] font-medium text-white/30">3 sets logged</span>
        </div>
        <ul class="divide-y divide-white/[0.06] font-mono-num">
          <li class="flex items-center justify-between px-4 py-2.5">
            <span class="text-[13px] text-white/40">Set 1</span>
            <span class="text-[15px] font-semibold tabular-nums text-white/80">80.0kg &times; 8</span>
          </li>
          <li class="flex items-center justify-between px-4 py-2.5">
            <span class="text-[13px] text-white/40">Set 2</span>
            <span class="flex items-center gap-2">
              <span class="rounded-md bg-amber-300 px-1.5 py-0.5 text-[10px] font-extrabold uppercase tracking-wide text-black">PR</span>
              <span class="text-[15px] font-semibold tabular-nums text-white">82.5kg &times; 8</span>
            </span>
          </li>
          <li class="flex items-center justify-between px-4 py-2.5">
            <span class="text-[13px] text-white/40">Set 3</span>
            <span class="text-[15px] font-semibold tabular-nums text-white/80">82.5kg &times; 7</span>
          </li>
        </ul>
      </section>

      <!-- ============ NEXT SET — GIANT NUMBERS ============ -->
      <section class="mt-6">
        <div class="mb-2 flex items-center justify-between px-1">
          <span class="text-[11px] font-bold uppercase tracking-wider text-white/40">Set 4 &middot; next</span>
          <button
            type="button"
            class="flex h-9 items-center gap-1.5 rounded-lg border border-white/15 px-3 text-[12px] font-bold uppercase tracking-wide text-white/60 transition active:scale-95 active:bg-white/10"
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
            (previous)
          </button>
        </div>

        <!-- Weight row -->
        <div class="flex items-stretch gap-2">
          <button type="button" aria-label="Decrease weight" class="flex h-24 w-16 flex-none items-center justify-center rounded-2xl border border-white/10 bg-white/[0.04] text-3xl font-bold text-white/70 transition active:scale-95 active:bg-white/10">&minus;</button>
          <div class="flex h-24 flex-1 flex-col items-center justify-center rounded-2xl border border-white/10 bg-white/[0.02]">
            <span class="hero-num tabular-nums text-6xl text-white sm:text-7xl">82.5</span>
            <span class="mt-0.5 text-[10px] font-bold uppercase tracking-[0.2em] text-white/35">kilograms</span>
          </div>
          <button type="button" aria-label="Increase weight" class="flex h-24 w-16 flex-none items-center justify-center rounded-2xl border border-white/10 bg-white/[0.04] text-3xl font-bold text-white/70 transition active:scale-95 active:bg-white/10">&plus;</button>
        </div>

        <!-- Reps row -->
        <div class="mt-3 flex items-stretch gap-2">
          <button type="button" aria-label="Decrease reps" class="flex h-24 w-16 flex-none items-center justify-center rounded-2xl border border-white/10 bg-white/[0.04] text-3xl font-bold text-white/70 transition active:scale-95 active:bg-white/10">&minus;</button>
          <div class="flex h-24 flex-1 flex-col items-center justify-center rounded-2xl border border-white/10 bg-white/[0.02]">
            <span class="hero-num tabular-nums text-6xl text-white sm:text-7xl">8</span>
            <span class="mt-0.5 text-[10px] font-bold uppercase tracking-[0.2em] text-white/35">reps</span>
          </div>
          <button type="button" aria-label="Increase reps" class="flex h-24 w-16 flex-none items-center justify-center rounded-2xl border border-white/10 bg-white/[0.04] text-3xl font-bold text-white/70 transition active:scale-95 active:bg-white/10">&plus;</button>
        </div>
      </section>

    </main>

    <!-- ============ FIXED LOWER-THIRD ACTION ============ -->
    <div class="safe-b flex-none border-t border-white/10 bg-[#050505] px-4 pt-3">
      <button
        type="button"
        class="flex h-16 w-full items-center justify-center gap-2 rounded-2xl bg-lime-300 text-xl font-black uppercase tracking-wide text-black shadow-[0_0_0_1px_rgba(211,249,90,0.3),0_8px_24px_-8px_rgba(211,249,90,0.6)] transition active:scale-[0.98] active:bg-lime-400"
      >
        Log Set
      </button>
    </div>

  </div>

</body>
</html>
