<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Barbell Bench Press — ProgressiveOverload</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: '#0A0A0B',
          surface: '#17171A',
          surface2: '#1F1F23',
          accent: '#FB923C',
          accentdim: '#7C4A22',
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
        },
        boxShadow: {
          card: '0 4px 16px 0 rgba(0,0,0,0.45)',
          barup: '0 -8px 24px 0 rgba(0,0,0,0.55)',
        },
      },
    },
  };
</script>
<style>
  html, body { background-color: #0A0A0B; }
  * { -webkit-tap-highlight-color: transparent; }
  .num-tabular { font-variant-numeric: tabular-nums; }
  .active-press:active { transform: scale(0.96); opacity: 0.85; }
  .active-press-btn:active { transform: scale(0.98); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body class="bg-base text-white font-sans min-h-screen">

  <div class="max-w-md mx-auto min-h-screen relative flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-20 bg-base/95 backdrop-blur border-b border-white/10">
      <div class="flex items-center gap-2 px-4 py-3">
        <button aria-label="Back to session" class="active-press shrink-0 w-11 h-11 flex items-center justify-center rounded-full bg-surface active:bg-surface2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div class="min-w-0 flex-1">
          <p class="text-[11px] uppercase tracking-wider text-white/40 leading-none mb-1">Exercise 3 of 5</p>
          <h1 class="text-lg font-bold leading-tight truncate">Barbell Bench Press</h1>
        </div>
        <button aria-label="Exercise options" class="active-press shrink-0 w-11 h-11 flex items-center justify-center rounded-full active:bg-surface">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
            <circle cx="12" cy="5" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="12" cy="19" r="1.8" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable content -->
    <main class="flex-1 px-4 pt-4 pb-64">

      <!-- Last time reference -->
      <div class="mb-6 px-1">
        <p class="text-sm text-white/40">
          <span class="text-white/30">Last time:</span>
          <span class="text-white/50">80kg × 8, 80kg × 7, 80kg × 6</span>
        </p>
      </div>

      <!-- Timeline -->
      <section aria-label="Completed sets this session">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-white/40 mb-3 px-1">This session</h2>

        <div class="relative">
          <!-- vertical timeline rail -->
          <div class="absolute left-[19px] top-2 bottom-2 w-px bg-white/10"></div>

          <!-- Set 1 -->
          <div class="relative flex items-stretch gap-3 pb-3">
            <div class="relative z-10 shrink-0 w-10 flex justify-center pt-3">
              <div class="w-4 h-4 rounded-full bg-surface2 border-2 border-white/25"></div>
            </div>
            <div class="flex-1 bg-surface rounded-2xl shadow-card px-4 py-3 flex items-center justify-between">
              <div>
                <p class="text-[11px] uppercase tracking-wide text-white/40 mb-0.5">Set 1</p>
                <p class="text-2xl font-extrabold num-tabular leading-none">
                  82.5<span class="text-base font-semibold text-white/50">kg</span>
                  <span class="text-white/30 mx-1">×</span>8
                </p>
              </div>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5" />
              </svg>
            </div>
          </div>

          <!-- Set 2 (PR) -->
          <div class="relative flex items-stretch gap-3 pb-3">
            <div class="relative z-10 shrink-0 w-10 flex justify-center pt-3">
              <div class="w-4 h-4 rounded-full bg-accent border-2 border-accent shadow-[0_0_0_4px_rgba(251,146,60,0.15)]"></div>
            </div>
            <div class="flex-1 bg-surface rounded-2xl shadow-card px-4 py-3 flex items-center justify-between border border-accent/30">
              <div>
                <div class="flex items-center gap-2 mb-0.5">
                  <p class="text-[11px] uppercase tracking-wide text-white/40">Set 2</p>
                  <span class="inline-flex items-center gap-1 bg-accent/15 text-accent text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2L12 16.4 5.7 21l2.3-7.2-6-4.6h7.6z"/></svg>
                    PR
                  </span>
                </div>
                <p class="text-2xl font-extrabold num-tabular leading-none">
                  85<span class="text-base font-semibold text-white/50">kg</span>
                  <span class="text-white/30 mx-1">×</span>6
                </p>
              </div>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5" />
              </svg>
            </div>
          </div>

          <!-- Next set marker (pending) -->
          <div class="relative flex items-stretch gap-3">
            <div class="relative z-10 shrink-0 w-10 flex justify-center pt-3">
              <div class="w-4 h-4 rounded-full border-2 border-dashed border-white/25"></div>
            </div>
            <p class="flex-1 text-sm text-white/30 pt-3">Set 3 — next</p>
          </div>
        </div>
      </section>

      <!-- Next set input card -->
      <section aria-label="Log next set" class="mt-6">
        <div class="bg-surface rounded-3xl shadow-card p-4">
          <div class="flex items-center justify-between mb-4 px-1">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-white/40">Set 3</h2>
            <button class="active-press-btn text-xs font-semibold text-accent bg-accent/10 px-3 py-2 rounded-full active:bg-accent/20">
              (previous)
            </button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <!-- Weight -->
            <div class="bg-surface2 rounded-2xl p-3 flex flex-col items-center">
              <p class="text-[11px] uppercase tracking-wide text-white/40 mb-2">Weight (kg)</p>
              <div class="flex items-center justify-between w-full gap-1">
                <button aria-label="Decrease weight" class="active-press w-11 h-11 shrink-0 flex items-center justify-center rounded-full bg-surface active:bg-black/40 text-2xl font-bold leading-none">−</button>
                <span class="flex-1 text-center text-4xl font-extrabold num-tabular tracking-tight">85</span>
                <button aria-label="Increase weight" class="active-press w-11 h-11 shrink-0 flex items-center justify-center rounded-full bg-surface active:bg-black/40 text-2xl font-bold leading-none">+</button>
              </div>
            </div>
            <!-- Reps -->
            <div class="bg-surface2 rounded-2xl p-3 flex flex-col items-center">
              <p class="text-[11px] uppercase tracking-wide text-white/40 mb-2">Reps</p>
              <div class="flex items-center justify-between w-full gap-1">
                <button aria-label="Decrease reps" class="active-press w-11 h-11 shrink-0 flex items-center justify-center rounded-full bg-surface active:bg-black/40 text-2xl font-bold leading-none">−</button>
                <span class="flex-1 text-center text-4xl font-extrabold num-tabular tracking-tight">6</span>
                <button aria-label="Increase reps" class="active-press w-11 h-11 shrink-0 flex items-center justify-center rounded-full bg-surface active:bg-black/40 text-2xl font-bold leading-none">+</button>
              </div>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Docked bottom action bar: rest timer + primary log action -->
    <div class="fixed bottom-0 left-0 right-0 z-30">
      <div class="max-w-md mx-auto bg-base/95 backdrop-blur border-t border-white/10 shadow-barup safe-bottom">
        <div class="px-4 pt-4">

          <!-- Rest timer, active mid-countdown -->
          <div class="flex items-center gap-3 bg-surface rounded-2xl px-4 py-3 mb-3">
            <div class="relative w-12 h-12 shrink-0">
              <svg viewBox="0 0 100 100" class="w-12 h-12 -rotate-90">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#1F1F23" stroke-width="8" />
                <circle cx="50" cy="50" r="45" fill="none" stroke="#FB923C" stroke-width="8"
                        stroke-linecap="round" stroke-dasharray="282.6" stroke-dashoffset="18.8" />
              </svg>
              <div class="absolute inset-0 flex items-center justify-center">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2" /><path d="M9 2h6" />
                </svg>
              </div>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-[11px] uppercase tracking-wide text-white/40 leading-none mb-1">Rest</p>
              <p class="text-2xl font-extrabold num-tabular leading-none">1:24</p>
            </div>
            <button class="active-press-btn text-xs font-semibold text-white/60 bg-surface2 px-3 py-2 rounded-full active:bg-white/10">
              Skip
            </button>
          </div>

          <!-- Primary action -->
          <button class="active-press-btn w-full bg-accent text-black text-lg font-extrabold tracking-tight rounded-2xl py-4 flex items-center justify-center gap-2 shadow-[0_8px_24px_-6px_rgba(251,146,60,0.5)] active:bg-accent/90">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5" />
            </svg>
            Log Set
          </button>

          <div class="h-4"></div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
