<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Today — ProgressiveOverload</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background:#0a0a0a; }
  * { -webkit-tap-highlight-color: transparent; }
  .tnum { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="bg-[#0a0a0a] text-white font-sans">

<div class="mx-auto flex h-[100dvh] max-w-md flex-col">

  <!-- ============ HEADER ============ -->
  <header class="flex flex-none items-center gap-3 px-4 pb-2 pt-4">
    <div class="min-w-0 flex-1">
      <p class="text-[10px] font-semibold uppercase tracking-wider text-white/40">Monday · 4 August</p>
      <h1 class="text-2xl font-extrabold leading-tight">Today</h1>
    </div>
    <button aria-label="Profile" class="flex h-10 w-10 flex-none items-center justify-center rounded-full bg-white/5 text-sm font-bold text-white/70 active:bg-white/10">JA</button>
  </header>

  <main class="min-h-0 flex-1 overflow-y-auto px-4 pb-4">

    <!--
      The repeat card leads. Three of four interviewees log inside an app that hands them
      their programme, so the fastest path to a logged set is "the same thing as last time,
      then edit". Starting empty is the fallback, not the default.
    -->
    <section class="mt-2 overflow-hidden rounded-3xl border border-lime-400/20 bg-gradient-to-b from-lime-400/[0.08] to-lime-400/[0.02]">
      <div class="px-5 pt-5">
        <p class="text-[10px] font-bold uppercase tracking-wider text-lime-300/70">Repeat your last</p>
        <div class="mt-1 flex items-baseline gap-2">
          <h2 class="text-2xl font-extrabold leading-tight">Push Day A</h2>
          <span class="text-[13px] font-medium text-white/35">3 days ago</span>
        </div>

        <div class="mt-3 flex flex-wrap gap-1.5">
          <span class="rounded-full bg-white/[0.06] px-2.5 py-1 text-[11px] font-semibold text-white/55">Bench Press</span>
          <span class="rounded-full bg-white/[0.06] px-2.5 py-1 text-[11px] font-semibold text-white/55">Overhead Press</span>
          <span class="rounded-full bg-white/[0.06] px-2.5 py-1 text-[11px] font-semibold text-white/55">Dips</span>
          <span class="rounded-full bg-white/[0.06] px-2.5 py-1 text-[11px] font-semibold text-white/40">+3 more</span>
        </div>

        <div class="mt-4 flex items-center gap-4 border-t border-white/[0.07] pt-3 text-[12px] font-medium text-white/40">
          <span class="tnum">6 exercises</span>
          <span class="tnum">18 sets</span>
          <span class="tnum">52 min</span>
        </div>
      </div>

      <div class="px-5 pb-5 pt-4">
        <button class="w-full rounded-2xl bg-lime-400 py-4 text-lg font-extrabold tracking-tight text-black shadow-[0_8px_24px_-6px_rgba(163,230,53,0.45)] active:scale-[0.98] active:bg-lime-300">
          Repeat this session
        </button>
      </div>
    </section>

    <!-- Fallback path, deliberately quieter -->
    <button class="mt-3 flex w-full items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/[0.03] py-3.5 text-[15px] font-bold text-white/70 active:bg-white/[0.07]">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Start empty session
    </button>

    <!-- ============ RECENT ============ -->
    <div class="mb-2 mt-7 flex items-baseline justify-between px-1">
      <p class="text-[10px] font-bold uppercase tracking-wider text-white/40">Recent</p>
      <button class="text-[12px] font-bold text-white/35 active:text-white/60">See all</button>
    </div>

    <div class="space-y-2">
      <!-- a session that produced a PR carries the same typed badge as the exercise screen -->
      <button class="flex w-full items-center gap-3 rounded-2xl border border-white/5 bg-white/[0.03] px-4 py-3 text-left active:bg-white/[0.07]">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <p class="truncate text-[15px] font-bold">Pull Day B</p>
            <span class="flex flex-none items-center gap-1 rounded-full bg-lime-400 px-1.5 py-0.5 text-[9px] font-extrabold uppercase tracking-wide text-black">
              <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.6 1-4.9 4.5 1.3 6.7L12 17.3 6.1 20.5l1.3-6.7L2.5 9.3l6.6-1z"/></svg>
              1RM
            </span>
          </div>
          <p class="tnum mt-0.5 text-[12px] text-white/35">5 days ago · 5 exercises · 16 sets</p>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="flex-none text-white/25"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="flex w-full items-center gap-3 rounded-2xl border border-white/5 bg-white/[0.03] px-4 py-3 text-left active:bg-white/[0.07]">
        <div class="min-w-0 flex-1">
          <p class="truncate text-[15px] font-bold">Leg Day</p>
          <p class="tnum mt-0.5 text-[12px] text-white/35">8 days ago · 4 exercises · 14 sets</p>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="flex-none text-white/25"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="flex w-full items-center gap-3 rounded-2xl border border-white/5 bg-white/[0.03] px-4 py-3 text-left active:bg-white/[0.07]">
        <div class="min-w-0 flex-1">
          <p class="truncate text-[15px] font-bold">Push Day A</p>
          <p class="tnum mt-0.5 text-[12px] text-white/35">11 days ago · 6 exercises · 18 sets</p>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="flex-none text-white/25"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!--
      Bodyweight is load-bearing for DOTS but must never block logging, so it sits here as a
      dismissible nudge rather than a gate on the profile.
    -->
    <div class="mt-6 flex items-center gap-3 rounded-2xl border border-white/[0.07] bg-white/[0.02] px-4 py-3">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-none text-white/30"><path d="M12 3v18M5 8h14M7 8l-2 8h4zM17 8l2 8h-4z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p class="flex-1 text-[13px] text-white/45">Log your bodyweight to track relative strength</p>
      <button class="flex-none rounded-full bg-white/5 px-3 py-1.5 text-[11px] font-bold text-white/60 active:bg-white/10">Add</button>
    </div>

  </main>

  <!-- ============ NAV ============ -->
  <nav class="flex flex-none items-stretch border-t border-white/10 bg-[#0e0e10] pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-2">
    <button class="flex flex-1 flex-col items-center gap-1 py-1 text-lime-400">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="text-[10px] font-bold">Today</span>
    </button>
    <button class="flex flex-1 flex-col items-center gap-1 py-1 text-white/35 active:text-white/60">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="text-[10px] font-bold">History</span>
    </button>
    <button class="flex flex-1 flex-col items-center gap-1 py-1 text-white/35 active:text-white/60">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </button>
  </nav>

</div>
</body>
</html>
