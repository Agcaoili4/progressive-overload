<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Exercise — Barbell Bench Press</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="bg-black">

<div class="min-h-screen w-full flex justify-center bg-black">
  <div class="relative w-full max-w-md h-screen flex flex-col overflow-hidden bg-zinc-950 md:border-x md:border-white/10 md:shadow-2xl">

    <!-- ============ UPPER SCROLLABLE ZONE ============ -->
    <div class="flex-1 overflow-y-auto px-4 pt-4">

      <!-- Header -->
      <div class="flex items-center gap-3 py-2">
        <button class="flex items-center justify-center w-11 h-11 rounded-full bg-white/5 active:bg-white/15 active:scale-95 transition-transform shrink-0" aria-label="Back to session">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-wider text-white/40 font-semibold">Push Day A · Exercise 3 of 6</p>
          <h1 class="text-2xl font-extrabold text-white leading-tight truncate">Barbell Bench Press</h1>
        </div>
      </div>

      <!-- Last time reference -->
      <div class="flex items-center gap-2 mt-2 mb-6 px-1">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white/30 shrink-0">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <p class="text-sm text-white/35 font-medium truncate">Last time: 80kg × 8, 80kg × 7, 80kg × 6</p>
      </div>

      <!-- Completed sets ledger -->
      <div class="space-y-3 pb-6">
        <p class="text-xs uppercase tracking-wider text-white/40 font-semibold px-1 mb-1">This session</p>

        <!-- Set 1 -->
        <div class="flex items-center justify-between bg-white/[0.04] rounded-2xl px-4 py-4 border border-white/5">
          <div class="flex items-center gap-3">
            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-white/5 text-sm font-bold text-white/50 shrink-0">1</span>
            <p class="text-2xl font-extrabold text-white tabular-nums">
              80<span class="text-white/40 text-base font-semibold ml-0.5">kg</span>
              <span class="text-white/25 mx-1.5 font-medium">×</span>8
            </p>
          </div>
        </div>

        <!-- Set 2 -->
        <div class="flex items-center justify-between bg-white/[0.04] rounded-2xl px-4 py-4 border border-white/5">
          <div class="flex items-center gap-3">
            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-white/5 text-sm font-bold text-white/50 shrink-0">2</span>
            <p class="text-2xl font-extrabold text-white tabular-nums">
              82.5<span class="text-white/40 text-base font-semibold ml-0.5">kg</span>
              <span class="text-white/25 mx-1.5 font-medium">×</span>8
            </p>
          </div>
        </div>

        <!-- Set 3 — PR -->
        <div class="flex items-center justify-between bg-lime-400/[0.06] rounded-2xl px-4 py-4 border border-lime-400/25 ring-1 ring-lime-400/10">
          <div class="flex items-center gap-3">
            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-lime-400/10 text-sm font-bold text-lime-300 shrink-0">3</span>
            <p class="text-2xl font-extrabold text-white tabular-nums">
              82.5<span class="text-white/40 text-base font-semibold ml-0.5">kg</span>
              <span class="text-white/25 mx-1.5 font-medium">×</span>8
            </p>
          </div>
          <span class="flex items-center gap-1 rounded-full bg-lime-400 text-black text-[11px] font-extrabold px-2.5 py-1.5 shrink-0">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L21.5 9.3l-4.9 4.5 1.3 6.7L12 17.3l-5.9 3.2 1.3-6.7-4.9-4.5 6.6-1.04z"/></svg>
            PR
          </span>
        </div>
      </div>
    </div>

    <!-- ============ LOWER FIXED CONTROL DECK ============ -->
    <div class="shrink-0 bg-zinc-900 rounded-t-[28px] border-t border-white/10 shadow-[0_-12px_32px_-8px_rgba(0,0,0,0.6)] px-4 pt-4 pb-6 space-y-4">

      <!-- grip handle -->
      <div class="flex justify-center">
        <div class="w-9 h-1 rounded-full bg-white/15"></div>
      </div>

      <!-- Rest timer -->
      <div class="flex items-center gap-4 bg-black/40 rounded-2xl px-4 py-3 border border-white/5">
        <div class="relative w-14 h-14 shrink-0">
          <svg viewBox="0 0 56 56" class="w-14 h-14 -rotate-90">
            <circle cx="28" cy="28" r="24" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="5" />
            <circle cx="28" cy="28" r="24" fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round"
                    stroke-dasharray="150.8" stroke-dashoffset="10" />
          </svg>
          <span class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-lime-300">●</span>
        </div>
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-wider text-white/40 font-semibold">Resting</p>
          <p class="text-2xl font-extrabold text-white tabular-nums leading-tight">1:24</p>
        </div>
        <button class="ml-auto text-xs font-bold text-white/50 active:text-white/80 bg-white/5 active:bg-white/10 rounded-full px-3 py-2 shrink-0">
          Skip
        </button>
      </div>

      <!-- Next-set inputs -->
      <div class="grid grid-cols-2 gap-3">
        <!-- Weight stepper -->
        <div class="bg-black/40 rounded-2xl px-3 py-3 border border-white/5">
          <p class="text-[11px] uppercase tracking-wider text-white/40 font-semibold mb-2 text-center">Weight</p>
          <div class="flex items-center justify-between gap-1">
            <button onclick="step('weight', -2.5)" class="flex items-center justify-center w-11 h-11 rounded-xl bg-white/5 active:bg-white/15 active:scale-95 transition-transform text-xl font-bold text-white/70 shrink-0" aria-label="Decrease weight">−</button>
            <div class="flex-1 text-center">
              <span id="weight" class="text-3xl font-extrabold text-white tabular-nums">82.5</span>
              <span class="text-sm font-semibold text-white/40 block -mt-0.5">kg</span>
            </div>
            <button onclick="step('weight', 2.5)" class="flex items-center justify-center w-11 h-11 rounded-xl bg-white/5 active:bg-white/15 active:scale-95 transition-transform text-xl font-bold text-white/70 shrink-0" aria-label="Increase weight">+</button>
          </div>
        </div>

        <!-- Reps stepper -->
        <div class="bg-black/40 rounded-2xl px-3 py-3 border border-white/5">
          <p class="text-[11px] uppercase tracking-wider text-white/40 font-semibold mb-2 text-center">Reps</p>
          <div class="flex items-center justify-between gap-1">
            <button onclick="step('reps', -1)" class="flex items-center justify-center w-11 h-11 rounded-xl bg-white/5 active:bg-white/15 active:scale-95 transition-transform text-xl font-bold text-white/70 shrink-0" aria-label="Decrease reps">−</button>
            <div class="flex-1 text-center">
              <span id="reps" class="text-3xl font-extrabold text-white tabular-nums">8</span>
              <span class="text-sm font-semibold text-white/40 block -mt-0.5">reps</span>
            </div>
            <button onclick="step('reps', 1)" class="flex items-center justify-center w-11 h-11 rounded-xl bg-white/5 active:bg-white/15 active:scale-95 transition-transform text-xl font-bold text-white/70 shrink-0" aria-label="Increase reps">+</button>
          </div>
        </div>
      </div>

      <!-- (previous) button -->
      <button onclick="usePrevious()" class="w-full flex items-center justify-center gap-2 rounded-2xl bg-white/5 active:bg-white/10 active:scale-[0.99] transition-transform py-3 border border-white/5">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="text-white/50">
          <path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" />
        </svg>
        <span class="text-sm font-bold text-white/60">(previous)</span>
        <span class="text-sm font-bold text-white/35 tabular-nums">82.5kg × 8</span>
      </button>

      <!-- Log set — primary action -->
      <button class="w-full rounded-2xl bg-lime-400 active:bg-lime-300 active:scale-[0.98] transition-transform py-5 shadow-[0_8px_24px_-4px_rgba(163,230,53,0.45)]">
        <span class="text-xl font-extrabold text-black tracking-tight">Log Set</span>
      </button>
    </div>

  </div>
</div>

<script>
  const state = { weight: 82.5, reps: 8, prevWeight: 82.5, prevReps: 8 };
  function step(field, delta) {
    state[field] = Math.max(0, +(state[field] + delta).toFixed(1));
    document.getElementById(field).textContent = state[field];
  }
  function usePrevious() {
    state.weight = state.prevWeight;
    state.reps = state.prevReps;
    document.getElementById('weight').textContent = state.weight;
    document.getElementById('reps').textContent = state.reps;
  }
</script>

</body>
</html>
